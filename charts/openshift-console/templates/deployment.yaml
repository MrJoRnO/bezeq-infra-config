apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: openshift-console
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: openshift-console
  template:
    metadata:
      labels:
        app: openshift-console
    spec:
      serviceAccountName: default
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--k8s-mode=in-cluster"
            - "--user-auth=disabled"
            - "--k8s-auth=bearer-token"
            - "--listen=http://0.0.0.0:9000"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: BRIDGE_USER_AUTH
              value: "disabled"
            - name: BRIDGE_K8S_MODE
              value: "in-cluster"