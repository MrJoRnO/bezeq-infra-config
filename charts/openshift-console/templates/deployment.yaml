apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-console
  template:
    metadata:
      labels:
        app: openshift-console
    spec:
      serviceAccountName: default
      containers:
        - name: console
          image: "quay.io/openshift/origin-console:latest"
          # הסקריפט הזה מוצא את ה-bridge או ה-console ומריץ אותו
          command: ["/bin/sh", "-c"]
          args:
            - |
              BINARY=$(find / -name bridge -o -name console -type f -executable | head -n 1);
              echo "Found binary at: $BINARY";
              exec $BINARY \
                --k8s-mode=in-cluster \
                --user-auth=disabled \
                --k8s-auth=bearer-token \
                --listen=http://0.0.0.0:9000
          ports:
            - containerPort: 9000
          env:
            - name: BRIDGE_USER_AUTH
              value: "disabled"
            - name: BRIDGE_K8S_MODE
              value: "in-cluster"