apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-console
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-console
  template:
    metadata:
      labels:
        app: openshift-console
    spec:
      serviceAccountName: default
      containers:
        - name: console
          image: "quay.io/openshift/origin-console:latest"
          # הסקריפט הזה מוצא את הנתיב הנכון לבד
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Searching for console binary..."
              BIN_PATH=$(find / -type f -executable \( -name "bridge" -o -name "console" \) 2>/dev/null | head -n 1)
              if [ -z "$BIN_PATH" ]; then
                echo "ERROR: Could not find console or bridge binary!"
                exit 1
              fi
              echo "Found binary at $BIN_PATH. Starting console..."
              exec $BIN_PATH \
                --k8s-mode=in-cluster \
                --user-auth=disabled \
                --k8s-auth=bearer-token \
                --listen=http://0.0.0.0:9000
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: BRIDGE_USER_AUTH
              value: "disabled"
            - name: BRIDGE_K8S_MODE
              value: "in-cluster"