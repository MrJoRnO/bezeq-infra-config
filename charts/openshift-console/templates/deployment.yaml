apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: openshift-console
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: openshift-console
  template:
    metadata:
      labels:
        app: openshift-console
    spec:
      serviceAccountName: default
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            # הגדרות הליבה של הקונסול
            - name: BRIDGE_USER_AUTH
              value: "disabled"
            - name: BRIDGE_K8S_MODE
              value: "in-cluster"
            - name: BRIDGE_K8S_AUTH
              value: "bearer-token"
            - name: BRIDGE_LISTEN
              value: "http://0.0.0.0:9000"
            # תיקון לנתיבים פנימיים
            - name: BRIDGE_BASE_ADDRESS
              value: "/"
            - name: BRIDGE_PUBLIC_DIR
              value: "./static"